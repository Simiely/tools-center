name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node syntax check (all modules + frontend JS)
        run: |
          set -e
          for f in server.mjs lib/core/*.js lib/capabilities/*.js lib/capabilities/*/*.mjs lib/capabilities/*/*.js lib/routes/*.js lib/sdk.js public/js/*.js; do
            node --check "$f"
          done
          echo "✅ 语法检查全部通过"

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tools-center
        uses: actions/checkout@v4

      # 工具不内置：平台只打包自身，工具由用户挂载/在线添加（独立性原则，见 docs/deploy-nas.md）。
      # 如需预置工具，部署侧用卷挂载或 POST /api/tools/import 导入。

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
