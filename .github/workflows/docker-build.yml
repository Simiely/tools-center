name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tools-center
        uses: actions/checkout@v4

      - name: Clone wb-credits tool
        run: |
          mkdir -p tools/wb-credits
          git clone --depth 1 https://github.com/Simiely/workbuddy-credits-tool.git tools/wb-credits
          rm -rf tools/wb-credits/.git

      - name: Create tool.json for wb-credits
        run: |
          cat > tools/wb-credits/tool.json << 'JSON'
          {
            "id": "wb-credits",
            "name": "WorkBuddy 积分",
            "type": "app",
            "cmd": ["node", "wb-gui.mjs", "8123"],
            "port": 8123,
            "health": "/",
            "description": "多账号积分采集与可视化"
          }
          JSON

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
