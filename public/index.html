<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tools Center</title>
<style>
:root{
  --bg:#0a0d11; --surface:#13171e; --card:#1a1f29; --card-hover:#1f2530;
  --text:#eeeeee; --text2:#959da8; --text3:#5a6270;
  --line:#20262f; --line2:#2d3540;
  --brand:#ff7043; --brand-dim:#ff70431a;
  --ok:#4ade80; --warn:#facc15; --bad:#f87171;
  --r2:6px; --r3:10px; --r4:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}

.header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.header-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;border-radius:var(--r2);background:linear-gradient(135deg,var(--brand),#ff5722);display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
.logo-text{font-size:17px;font-weight:600;letter-spacing:-.3px}
.logo-text span{color:var(--text3);font-weight:400;margin-left:4px;font-size:12px}
.hdr-acts{display:flex;align-items:center;gap:8px}
.hdr-stat{font-size:11px;color:var(--text2);border-right:1px solid var(--line);padding-right:8px;display:none}
@media(min-width:600px){.hdr-stat{display:block}}
.cap-pill{font-size:11px;padding:4px 8px;border-radius:12px;border:1px solid var(--line);color:var(--text2);cursor:pointer;background:var(--surface);transition:.15s}
.cap-pill:hover{border-color:var(--line2);background:var(--card)}
.cap-pill.all-ok{color:var(--ok);border-color:var(--ok)33;background:var(--ok)10}
.cap-pill.has-err{color:var(--bad);border-color:var(--bad)55;background:var(--bad)10;animation:cap-warn 2s ease-in-out infinite}
@keyframes cap-warn{0%,100%{opacity:.7}50%{opacity:1}}

.tabs{position:sticky;top:56px;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs-inner{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs-inner::-webkit-scrollbar{display:none}
.tab{padding:10px 16px;font-size:12px;color:var(--text2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s;flex-shrink:0}
.tab:hover{color:var(--text)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}

.main{max-width:1200px;margin:0 auto;padding:16px 8px 60px}
@media(min-width:500px){.main{padding:20px}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:500px){.grid{gap:10px}}
@media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);padding:10px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;transition:.18s;position:relative;overflow:hidden}
.card:hover{background:var(--card-hover);border-color:var(--line2);transform:translateY(-1px)}
.card:active{transform:translateY(0)}
.card-icon{width:36px;height:36px;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.card-tag{font-size:9px;padding:1px 6px;border-radius:6px;position:absolute;top:6px;right:6px}
.card-tag.hosted{background:var(--brand-dim);color:var(--brand)}
.card-tag.link{background:#4ade8014;color:var(--ok)}
.card-name{font-size:11px;font-weight:600;line-height:1.3;word-break:break-word}
.card-desc{display:none}
.card-foot{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--text3);margin-top:auto}
.card-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.card-dot.ok{background:var(--ok)} .card-dot.warn{background:var(--warn)} .card-dot.bad{background:var(--bad)}
.del-btn{position:absolute;bottom:4px;right:4px;font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:var(--r2);opacity:.7;transition:.15s}
.card:hover .del-btn,.del-btn:focus-visible{opacity:1}
.del-btn:hover{color:var(--bad);background:#f8717114}
/* 能力徽标(卡片右下) */
.caps{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.cap-chip{font-size:8.5px;padding:1px 5px;border-radius:5px;border:1px solid var(--line2);color:var(--text2);letter-spacing:.3px}
.cap-chip.browser{color:#60a5fa;border-color:#60a5fa44;background:#60a5fa10}
.cap-chip.storage{color:#c084fc;border-color:#c084fc44;background:#c084fc10}
.cap-chip.network{color:#34d399;border-color:#34d39944;background:#34d39910}
/* 工具详情弹层 */
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.detail-icon{width:52px;height:52px;border-radius:14px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:26px;flex-shrink:0}
.detail-title{flex:1;min-width:0}
.detail-title h2{font-size:16px;font-weight:600;word-break:break-word}
.detail-title .d-sub{font-size:11px;color:var(--text2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.detail-title .d-sub .dot-row{display:flex;align-items:center;gap:5px}
.det-row{display:flex;gap:8px;font-size:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.det-row:last-child{border-bottom:none}
.det-row .k{color:var(--text3);width:70px;flex-shrink:0}
.det-row .v{color:var(--text);word-break:break-all;flex:1}
.det-acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.log-box{background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--text2);white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;line-height:1.5;margin-top:4px}
.log-empty{color:var(--text3);font-style:italic}
.cap-line{margin-top:10px}
.cap-line .caps{justify-content:flex-start;gap:6px}
.cap-line .cap-chip{font-size:10px;padding:3px 8px}

@media(min-width:500px){
  .card{padding:18px 14px 14px;gap:10px;border-radius:var(--r4)}
  .card-icon{width:48px;height:48px;border-radius:12px;font-size:24px}
  .card-tag{font-size:10px;padding:2px 7px;top:10px;right:10px}
  .card-name{font-size:13px}
  .card-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:10px;color:var(--text2);line-height:1.4}
  .card-foot{font-size:10px;gap:6px}
  .card-dot{width:6px;height:6px}
  .del-btn{bottom:8px;right:10px;padding:3px 6px;font-size:14px}
}

.sec{margin-bottom:28px}
.sec-title{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding-left:2px}
.sec-title .count{font-weight:400;color:var(--text3)}
@media(min-width:500px){.sec{margin-bottom:32px}.sec-title{font-size:11px;margin-bottom:10px}}

.empty{text-align:center;padding:80px 20px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.4}
.empty p{font-size:13px;color:var(--text2);margin-top:6px}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.mask.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);width:100%;max-width:500px;max-height:90vh;overflow:auto;padding:22px}
.modal h2{font-size:15px;font-weight:600;margin-bottom:16px}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500}
.finput{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);color:var(--text);padding:9px 12px;font-size:13px;font-family:inherit;outline:none}
.finput:focus{border-color:var(--brand)}
.finput::placeholder{color:var(--text3)}
.ftype{display:flex;gap:8px;margin-bottom:14px}
.ftype button{flex:1;padding:9px;border-radius:var(--r2);border:1px solid var(--line);background:var(--bg);color:var(--text2);cursor:pointer;font-size:12px;font-family:inherit}
.ftype button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-dim)}
.drop-zone{border:2px dashed var(--line);border-radius:var(--r3);padding:22px;text-align:center;cursor:pointer;background:var(--bg);transition:.15s}
.drop-zone:hover{border-color:var(--brand)}
.dz-icon{font-size:32px;margin-bottom:4px}
.dz-label{font-size:12px;color:var(--text2)}
.dz-info{font-size:10px;color:var(--text3);margin-top:2px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn{font:inherit;font-size:12px;padding:8px 16px;border-radius:var(--r2);border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:#ff5722}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{font-size:11px;padding:5px 12px}
.tip{font-size:11px;color:var(--text2);background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px;margin-bottom:10px;line-height:1.6}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--text2);white-space:pre-wrap;max-height:100px;overflow:auto}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 22px;border-radius:24px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:110;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.show{opacity:1}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo"><div class="logo-icon">TC</div><div class="logo-text">Tools Center<span id="meta"> 加载中</span></div></div>
    <div class="hdr-acts">
      <span class="hdr-stat" id="stat">—</span>
      <button class="sm btn" onclick="load()">刷新</button>
      <span class="cap-pill" id="capStatus" onclick="openCapDetail()" title="点击查看能力状态"></span>
      <button class="sm btn primary" onclick="openAdd()">+ 添加</button>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs"><div class="tabs-inner"><button class="tab on" data-cat="all">全部</button></div></nav>

<main class="main" id="main">
  <div class="empty"><div class="empty-icon">—</div><p>加载中</p></div>
</main>

<div class="mask" id="addMask">
  <div class="modal">
    <h2>添加工具</h2>
    <div class="ftype">
      <button id="ftApp" class="on" onclick="setType('app')">托管进程</button>
      <button id="ftLink" onclick="setType('link')">外部跳转</button>
      <button id="ftGit" onclick="setType('git')">Git 导入</button>
    </div>
    <div class="frow"><label>名称</label><input class="finput" id="fName" placeholder="我的工具"></div>
    <div id="fLinkRows" style="display:none">
      <div class="frow"><label>目标地址</label><input class="finput" id="fUrl" placeholder="http://..."></div>
    </div>
    <div id="fGitRows" style="display:none">
      <div class="tip">从 Git 仓库导入：自动识别 manifest.json/tool.json（根目录或一级子目录），克隆后立即托管运行。</div>
      <div class="frow"><label>仓库地址</label><input class="finput" id="fGitUrl" placeholder="https://github.com/user/repo.git"></div>
      <div class="frow"><label>分支（可选）</label><input class="finput" id="fGitBranch" placeholder="main / 留空默认"></div>
    </div>
    <div id="fAppRows">
      <div class="tip">自动分配端口并生成示例。<b style="color:var(--brand)">可选 zip 自动解压</b></div>
      <div class="frow"><label>代码 zip</label>
        <div class="drop-zone" id="dropZone"
          ondragover="event.preventDefault();this.style.borderColor='var(--brand)'"
          ondragleave="this.style.borderColor='var(--line)'"
          ondrop="event.preventDefault();this.style.borderColor='var(--line)';handleDrop(event.dataTransfer.files)"
          onclick="pickZip()">
          <div class="dz-icon">&#x1F4E6;</div>
          <div class="dz-label">点击或拖拽 zip</div>
          <div class="dz-info" id="fZipInfo">未选择</div>
        </div>
      </div>
    </div>
    <button class="btn" id="advBtn" onclick="toggleAdv()" style="width:100%;text-align:center">高级设置 ▸</button>
    <div id="fAdv" style="display:none;margin-top:10px">
      <div class="frow"><label>ID</label><input class="finput" id="fId" placeholder="自动生成"></div>
      <div class="frow"><label>描述</label><input class="finput" id="fDesc" placeholder="一句话说明"></div>
      <div class="frow"><label>分组</label><input class="finput" id="fGroup" value="工具"></div>
      <div class="frow"><label>图标</label><input class="finput" id="fIcon" value="🔧"></div>
      <div id="fAdvApp">
        <div class="frow"><label>启动命令</label><input class="finput" id="fCmd" placeholder='自动: ["node","server.mjs","端口"]'></div>
        <div class="frow"><label>端口</label><input class="finput" id="fPort" type="number" placeholder="自动"></div>
        <div class="frow"><label>健康检查</label><input class="finput" id="fHealth" placeholder="/health"></div>
      </div>
    </div>
    <div class="frow"><label>预览</label><div class="preview" id="fPreview">{ }</div></div>
    <div class="frow" style="align-items:flex-start"><label></label><button class="btn" onclick="validateManifestUI()" style="width:auto">✓ 校验配置</button><div id="fValidateResult" style="display:none;margin-left:8px;font-size:12px;padding-top:7px"></div></div>
    <div class="acts">
      <button class="btn" onclick="closeAdd()">取消</button>
      <button class="btn primary" onclick="saveAdd()">保存并启用</button>
    </div>
  </div>
</div>
<input type="file" id="fZipInput" accept=".zip" hidden>

<!-- 工具详情弹层 -->
<div class="mask" id="detMask">
  <div class="modal" style="max-width:460px">
    <div class="detail-head">
      <div class="detail-icon" id="detIcon">🔧</div>
      <div class="detail-title">
        <h2 id="detName">—</h2>
        <div class="d-sub">
          <span id="detType"></span>
          <span class="dot-row"><span class="card-dot" id="detDot"></span><span id="detStatus"></span></span>
        </div>
      </div>
    </div>
    <div class="det-row"><span class="k">ID</span><span class="v" id="detId">—</span></div>
    <div class="det-row"><span class="k">端口</span><span class="v" id="detPort">—</span></div>
    <div class="det-row"><span class="k">能力</span><span class="v"><span class="caps" id="detCaps" style="justify-content:flex-start"></span></span></div>
    <div class="det-row"><span class="k">错误</span><span class="v" id="detErr" style="color:var(--bad)">—</span></div>
    <div class="det-row"><span class="k">日志</span><span class="v"><button class="btn sm" onclick="loadLog()">刷新日志</button></span></div>
    <div class="log-box" id="detLog"><span class="log-empty">加载中…</span></div>
    <div class="det-acts">
      <button class="btn sm" id="detOpen" onclick="openToolDetail()">打开</button>
      <button class="btn sm" id="detRestart" onclick="restartTool()" style="display:none">重启</button>
      <button class="btn sm danger" onclick="closeDet()">关闭</button>
    </div>
  </div>
</div>

<!-- 能力状态弹层 -->
<div class="mask" id="capMask">
  <div class="modal" style="max-width:420px">
    <h2>能力状态</h2>
    <div class="tip">能力模块按需启动(工具首次调用才加载),空闲 600s 自动回收。</div>
    <div id="capList"></div>
    <div class="acts"><button class="btn danger" onclick="closeCap()">关闭</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="mask" id="cfmMask">
  <div class="modal" style="max-width:340px">
    <h2>确认删除</h2>
    <div class="tip" id="cfmMsg"></div>
    <input class="finput" id="cfmPass" type="password" placeholder="管理员密码">
    <div class="acts">
      <button class="btn" onclick="closeCfm(false)">取消</button>
      <button class="btn danger" id="cfmOk">确认</button>
    </div>
  </div>
</div>

<div class="mask" id="adminMask">
  <div class="modal" style="max-width:340px">
    <h2>设置管理员密码</h2>
    <div class="tip">用于删除工具等敏感操作</div>
    <input class="finput" id="adminPass1" type="password" placeholder="至少 4 位">
    <div class="acts"><button class="btn primary" id="adminOk">确认</button></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}

let tools=[], activeCat="all", activeCap="";

async function load(){
  try{
    const j=await(await fetch("/api/tools",{cache:"no-store"})).json();
    if(!j.ok)throw new Error(j.error);
    tools=(j.tools||[]).filter(t=>!t.hidden);
    renderTabs();
    renderCards();
    const running=tools.filter(t=>t.status&&t.status.status==="running").length;
    $("stat").textContent=running+"/"+tools.length+" 运行";
    $("meta").textContent=" · "+tools.length+" 工具";
    loadCaps();  // 并行加载能力状态(更新顶栏指示器)
  }catch(e){$("main").innerHTML=`<div class="empty"><div class="empty-icon">!</div><p>${e.message}</p></div>`}
}

async function loadCaps(){
  try{
    const j=await(await fetch("/api/capabilities",{cache:"no-store"})).json();
    if(!j.ok)return;
    const caps=j.capabilities||[];
    const pill=$("capStatus");
    const errors=caps.filter(c=>c.status==="error");
    const running=caps.filter(c=>c.status==="running").length;
    if(errors.length){
      pill.textContent="⚠ "+errors.length+" 能力异常";
      pill.className="cap-pill has-err";
      pill.dataset.err=errors.map(c=>c.name+": "+(c.error||"未知")).join("\n");
    }else{
      const total=caps.length;
      pill.textContent="✓ "+(total?running+"/"+total+" 能力":"无能力");
      pill.className="cap-pill "+(running?"all-ok":"");
    }
  }catch{}
}
async function openCapDetail(){
  $("capMask").classList.add("show");
  try{
    const j=await(await fetch("/api/capabilities",{cache:"no-store"})).json();
    const caps=(j.capabilities||[]);
    $("capList").innerHTML=caps.map(c=>{
      const ok=c.status==="running";
      const err=c.status==="error";
      const idle=c.status==="idle";
      const col=ok?"var(--ok)":(err?"var(--bad)":"var(--text3)");
      return `<div style="padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:13px;font-weight:500">${esc(capLabel(c.name))}</div><div style="font-size:10.5px;color:var(--text3)">${esc(c.error||(ok?"已启动":(idle?"未启动":"启动中")))}</div></div>
        <span style="font-size:11px;color:${col};font-weight:600">${esc(c.status).toUpperCase()}</span>
      </div>`}).join("")||'<div style="text-align:center;color:var(--text3);padding:20px">暂无能力</div>';
  }catch(e){$("capList").textContent="加载失败"}
}
function closeCap(){$("capMask").classList.remove("show")}

function renderTabs(){
  const cats=[...new Set(tools.map(t=>t.group||"工具"))];
  const caps=[...new Set(tools.flatMap(t=>t.capabilities||[]))];
  $("tabs").querySelector(".tabs-inner").innerHTML=
    `<button class="tab ${activeCat==="all"&&!activeCap?"on":""}" data-cat="all" data-cap="" onclick="setCat('all','')">全部</button>`+
    caps.map(c=>`<button class="tab ${activeCap===c?"on":""}" data-cap="${esc(c)}" onclick="setCat('', this.dataset.cap)">${esc(capLabel(c))}</button>`).join("")+
    cats.filter(c=>c!=="全部").map(c=>`<button class="tab ${activeCat===c?"on":""}" data-cat="${esc(c)}" onclick="setCat(this.dataset.cat,'')">${esc(c)}</button>`).join("")
}
function capLabel(c){return c==="browser"?"🌐 浏览器":c==="storage"?"💾 存储":c==="network"?"🌍 网络":c}

function setCat(c,cap){activeCat=c;activeCap=cap;renderTabs();renderCards()}

function renderCards(){
  let filtered=tools;
  if(activeCap)filtered=filtered.filter(t=>(t.capabilities||[]).includes(activeCap));
  if(activeCat&&activeCat!=="all")filtered=filtered.filter(t=>(t.group||"工具")===activeCat);
  if(!filtered.length){$("main").innerHTML='<div class="empty"><div class="empty-icon">&#x1F50D;</div><p>无匹配工具</p></div>';return}
  window.__tools=filtered;
  const groups={};
  for(const t of filtered)(groups[t.group||"工具"]=groups[t.group||"工具"]||[]).push(t);
  $("main").innerHTML=Object.entries(groups).map(([g,arr])=>
    `<div class="sec"><div class="sec-title">${esc(g)} <span class="count">${arr.length}</span></div><div class="grid">${arr.map(cardHtml).join("")}</div></div>`).join("")
}

function cardHtml(t){
  const st=t.status||{};
  const dotCls=t.type==="link"?"warn":(st.status==="running"?"ok":(st.status==="error"?"bad":"warn"));
  const stxt=t.type==="link"?"链接":(st.status==="running"?"运行":(st.status||"—"));
  const caps=(t.capabilities||[]).map(c=>`<span class="cap-chip ${esc(c)}">${esc(capLabel(c))}</span>`).join("");
  return`<div class="card" data-id="${esc(t.id)}">
    <span class="card-tag ${t.type==="app"?"hosted":"link"}">${t.type==="app"?"托管":"链接"}</span>
    <div class="card-icon">${esc(t.icon||"🧰")}</div>
    <div class="card-name">${esc(t.name)}</div>
    <div class="card-desc">${esc(t.desc||"")}</div>
    ${caps?`<div class="caps">${caps}</div>`:""}
    <div class="card-foot"><span class="card-dot ${dotCls}"></span>${stxt}</div>
    <button class="del-btn" data-id="${esc(t.id)}" data-name="${esc(t.name)}" title="删除">&#x1F5D1;</button>
  </div>`
}

document.addEventListener("click",e=>{
  const del=e.target.closest(".del-btn");
  if(del){e.stopPropagation();delTool(del.dataset.id,del.dataset.name);return}
  const card=e.target.closest(".card");
  if(!card)return;
  const t=(window.__tools||[]).find(x=>x.id===card.dataset.id);
  if(t)openDetail(t)
});

// Add tool
let addType="app",advOpen=!1;
function openAdd(){$("addMask").classList.add("show");updatePreview()}
function closeAdd(){$("addMask").classList.remove("show")}
function toggleAdv(){advOpen=!advOpen;$("fAdv").style.display=advOpen?"":"none";$("advBtn").textContent=(advOpen?"▾":"▸")+" 高级设置";updatePreview()}
function setType(t){addType=t;$("ftApp").classList.toggle("on",t==="app");$("ftLink").classList.toggle("on",t==="link");$("ftGit").classList.toggle("on",t==="git");$("fAppRows").style.display=t==="app"?"":"none";$("fLinkRows").style.display=t==="link"?"":"none";$("fGitRows").style.display=t==="git"?"":"none";$("fAdvApp").style.display=t==="app"?"":"none";updatePreview()}
function collectSpec(){
  if(addType==="git")return {git:true,name:($("fName").value||"").trim(),url:($("fGitUrl").value||"").trim(),branch:($("fGitBranch").value||"").trim(),id:$("fId").value.trim()};
  const s={name:($("fName").value||"").trim(),type:addType};
  if(addType==="link")s.url=($("fUrl").value||"").trim();
  const a={id:$("fId").value.trim(),desc:$("fDesc").value.trim(),group:$("fGroup").value.trim(),icon:$("fIcon").value.trim(),cmd:$("fCmd").value.trim(),port:$("fPort").value.trim(),health:$("fHealth").value.trim()};
  if(a.id)s.id=a.id;if(a.desc)s.desc=a.desc;if(a.group&&a.group!=="工具")s.group=a.group;if(a.icon&&a.icon!=="🔧")s.icon=a.icon;
  if(addType==="app"){if(a.cmd){try{const c=JSON.parse(a.cmd);if(Array.isArray(c))s.cmd=c}catch{}}if(a.port)s.port=parseInt(a.port,10);if(a.health)s.health=a.health}
  return s
}
function updatePreview(){const s=collectSpec();$("fPreview").textContent=s.git?`Git 导入: ${s.url||"(未填)"}`:JSON.stringify(s,null,2)}
["fName","fUrl","fId","fDesc","fGroup","fIcon","fCmd","fPort","fHealth","fGitUrl","fGitBranch"].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener("input",updatePreview)});

let selZip=null;
function pickZip(){$("fZipInput").value="";$("fZipInput").click()}
function handleDrop(files){if(files.length){selZip=files[0];$("fZipInfo").textContent=selZip.name+" ("+Math.round(selZip.size/1024)+" KB)"}}
$("fZipInput").addEventListener("change",()=>{const f=$("fZipInput").files[0];if(f){selZip=f;$("fZipInfo").textContent=f.name+" ("+Math.round(f.size/1024)+" KB)"}})
async function uploadZipTo(id,zip){const fd=new FormData();fd.append("path","tools/"+id+"/");fd.append("file",zip,zip.name);const j=await(await fetch("/api/files",{method:"POST",body:fd})).json();if(!j.ok)throw new Error(j.error);await fetch("/api/tools/"+id+"/restart",{method:"POST"})}
async function saveAdd(){
  const spec=collectSpec();
  if(!spec.name){toast("请填写名称");return}
  try{
    let j;
    if(spec.git){
      if(!/^https?:\/\//.test(spec.url||"")){toast("Git 仓库需 http(s) 地址");return}
      j=await(await fetch("/api/tools/import",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:spec.url,branch:spec.branch||undefined,id:spec.id||undefined})})).json();
    }else{
      if(spec.type==="link"&&!/^https?:\/\//.test(spec.url||"")){toast("link 型需 http(s) 地址");return}
      j=await(await fetch("/api/tools",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(spec)})).json();
    }
    if(!j.ok)throw new Error(j.error);
    const id=j.tool&&j.tool.id;
    if(spec.type==="app"&&id&&selZip)await uploadZipTo(id,selZip);
    closeAdd();["fName","fUrl","fId","fDesc","fGroup","fIcon","fCmd","fPort","fHealth","fGitUrl","fGitBranch"].forEach(x=>{const el=document.getElementById(x);if(el)el.value=""});
    selZip=null;$("fZipInfo").textContent="未选择";
    toast("已创建");load()
  }catch(e){toast(e.message)}
}

// manifest 在线校验(不写盘):POST 内容 → 显示错误/归一化结果
async function validateManifestUI(){
  const v=($("fCmd").value||"").trim();
  let spec=collectSpec();
  if(spec.git){toast("Git 模式无需校验");return}
  if(v&&!spec.cmd){try{spec.cmd=JSON.parse(v)}catch{toast("启动命令需 JSON 数组,如 [\"node\",\"server.mjs\"]");return}}
  const show=document.getElementById("fValidateResult");
  try{
    const j=await(await fetch("/api/tools/validate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({manifest:spec})})).json();
    if(show){
      if(j.ok){
        const n=j.normalized||{};
        show.innerHTML=`<span style="color:var(--ok,#2ea043)">✓ 配置有效</span> · ${n.type}${n.port?" · :"+n.port:""}${n.capabilities&&n.capabilities.length?" · 能力: "+n.capabilities.join("/"):""}${n.runtime?" · "+n.runtime:""}`;
        show.style.display="block";show.style.color="";
      }else{
        show.innerHTML=`<span style="color:#d1242f">✕ ${(j.errors||[]).join("; ")}</span>`;
        show.style.display="block";
      }
    }else toast(j.ok?"✓ 配置有效":(j.errors||[]).join("; "));
  }catch(e){toast("校验失败: "+e.message)}
}

let cfmResolve=null;
// ---------- 工具详情 ----------
let curDetail=null;
function openDetail(t){
  curDetail=t;
  $("detIcon").textContent=t.icon||"🔧";
  $("detName").textContent=t.name;
  $("detId").textContent=t.id;
  $("detType").textContent=t.type==="link"?"外部跳转":"托管进程";
  $("detPort").textContent=t.type==="link"?(t.url||"—"):(t.port||"—");
  const caps=(t.capabilities||[]).map(c=>`<span class="cap-chip ${esc(c)}">${esc(capLabel(c))}</span>`).join("");
  $("detCaps").innerHTML=caps||'<span style="color:var(--text3)">—</span>';
  const st=t.status||{};
  const stxt=t.type==="link"?"链接":(st.status==="running"?"运行中":(st.status==="stopped"?"已停止":(st.status||"—")));
  $("detStatus").textContent=stxt+" "+(st.health==="ok"?"· 健康":"");
  $("detDot").className="card-dot "+(t.type==="link"?"warn":(st.status==="running"?"ok":(st.status==="error"?"bad":"warn")));
  $("detErr").textContent=t.error||st.error||"—";
  $("detOpen").textContent=t.type==="link"?"打开链接":"打开界面";
  $("detRestart").style.display=t.type==="app"?"":"none";
  $("detMask").classList.add("show");
  loadLog();
}
function closeDet(){$("detMask").classList.remove("show");curDetail=null}
function openToolDetail(){if(curDetail)window.open(curDetail.type==="link"?curDetail.url:"/tool/"+curDetail.id+"/","_blank")}
async function loadLog(){
  if(!curDetail)return;
  const id=curDetail.id;
  try{
    const j=await(await fetch("/api/logs/"+id,{cache:"no-store"})).json();
    const box=$("detLog");
    if(j.ok&&j.lines&&j.lines.length)box.innerHTML=j.lines.map(l=>esc(l)).join("\n")||'<span class="log-empty">(空)</span>';
    else box.innerHTML='<span class="log-empty">'+(j.error||"无日志")+"</span>";
    box.scrollTop=box.scrollHeight;
  }catch(e){$("detLog").innerHTML='<span class="log-empty">日志获取失败</span>'}
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function restartTool(){
  if(!curDetail)return;
  try{
    const j=await(await fetch("/api/tools/"+curDetail.id+"/restart",{method:"POST"})).json();
    if(!j.ok)throw new Error(j.error);
    toast("已重启");setTimeout(()=>{loadLog();load()},1500)
  }catch(e){toast(e.message)}
}
function cfmConfirm(msg){return new Promise(r=>{cfmResolve=r;$("cfmMsg").textContent=msg;$("cfmPass").value="";$("cfmMask").classList.add("show");setTimeout(()=>$("cfmPass").focus(),100)})}
function closeCfm(ok){const pass=$("cfmPass").value;$("cfmMask").classList.remove("show");if(cfmResolve){cfmResolve(ok?pass:null);cfmResolve=null}}
$("cfmOk").addEventListener("click",()=>closeCfm(!0));
$("cfmPass").addEventListener("keydown",e=>{if(e.key==="Enter")closeCfm(!0)});
async function delTool(id,name){const pass=await cfmConfirm("确认删除 "+name+" ?");if(!pass)return;try{const j=await(await fetch("/api/tools",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,pass})})).json();if(!j.ok)throw new Error(j.error);toast("已删除");load()}catch(e){toast(e.message)}}

async function checkAdminPass(){try{const j=await(await fetch("/api/admin/pass")).json();if(!j.set){$("adminMask").classList.add("show");setTimeout(()=>$("adminPass1").focus(),200)}}catch{}}
async function setAdminPass(){const p=$("adminPass1").value;if(!p||p.length<4){toast("密码至少 4 位");return}try{const j=await(await fetch("/api/admin/pass",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pass:p})})).json();if(!j.ok)throw new Error(j.error);$("adminMask").classList.remove("show");toast("已设置")}catch(e){toast(e.message)}}
$("adminOk").addEventListener("click",setAdminPass);
$("adminPass1").addEventListener("keydown",e=>{if(e.key==="Enter")setAdminPass()});
checkAdminPass();
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeAdd();closeDet()}});
load();
</script>
</body>
</html>
