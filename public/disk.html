<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>存储管理 · Tools Center</title>
<style>
:root{
  --bg:#141419; --surface:#1d1d26; --card:#24242f; --card-hover:#2a2a38;
  --text:#e8e8f0; --text2:#9a9ab0; --text3:#6c6c85;
  --line:#2e2e3d; --line2:#3a3a4d;
  --brand:#ff9292; --brand-h:#ff7a7a; --brand-a:#e67878; --brand-b:#cc7575; --brand-d:#995858;
  --brand-dim:#ff92921a; --on-brand:#2d1414; --pink2:#ffb3b3;
  --cyan:#92ffff; --peach:#ffc892; --ppink:#ff92c8; --bpink:#b0a0ff; --purple:#a78bfa;
  --ok:#6dd58c; --warn:#ffc892; --bad:#ff6b6b; --amber:#ffc892; --coral:#ff8a5c;
  --r2:6px; --r3:10px; --r4:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;background:var(--bg)}
body{background:transparent;color:var(--text);font-family:"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(640px 420px at 12% -6%, rgba(255,146,146,.16), transparent 70%), radial-gradient(760px 520px at 90% 110%, rgba(146,255,255,.11), transparent 70%), radial-gradient(540px 400px at 62% 128%, rgba(167,139,250,.10), transparent 70%)}
button{font:inherit;cursor:pointer}
.btn{font-size:12px;padding:6px 12px;border-radius:var(--r2);border:1px solid var(--line);background:rgba(36,36,47,.75);color:var(--text);cursor:pointer;transition:.15s;font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-h)}
.btn.danger{color:var(--bad);border-color:var(--bad)66}
.btn.danger:hover{background:var(--bad)15}
.btn.sm{font-size:11px;padding:4px 10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line)}

.header{position:sticky;top:0;z-index:50;background:rgba(20,20,25,.55);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.header-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;border-radius:var(--r2);background:linear-gradient(135deg,var(--brand),#ff5722);display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
.logo-text{font-size:17px;font-weight:600;letter-spacing:-.3px}
.logo-text span{color:var(--text3);font-weight:400;margin-left:4px;font-size:12px}
.hdr-acts{display:flex;align-items:center;gap:8px}

.main{max-width:1200px;margin:0 auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);padding:12px 14px}
.stat .s-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.stat .s-val{font-size:18px;font-weight:600}
.stat .s-val small{font-size:11px;color:var(--text3);font-weight:400;margin-left:4px}
.stat.reclaim{background:var(--brand-dim);border-color:var(--brand)44}
.stat.reclaim .s-val{color:var(--brand)}

.tool-card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:var(--r3);margin-bottom:12px;overflow:hidden;transition:border-color .15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.tool-card:hover{border-color:rgba(255,146,146,.75)}
.tc-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:760px){.tc-grid{grid-template-columns:1fr}}
.tc-col{padding:12px 14px;min-width:0}
.tc-col.prog{border-right:1px solid var(--line)}
@media(max-width:760px){.tc-col.prog{border-right:none;border-bottom:1px solid var(--line)}}
.tc-title{font-size:11px;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tc-title .tag{font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid var(--line)}
.tc-name{font-size:14px;font-weight:600;word-break:break-all}
.tc-name small{color:var(--text3);font-weight:400;margin-left:6px}
.tc-meta{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.6}
.tc-meta b{color:var(--text);font-weight:500}
.tc-acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;display:inline-block;margin-left:6px;vertical-align:1px}
.b-managed{color:var(--ok);border:1px solid var(--ok)44;background:var(--ok)10}
.b-invalid{color:var(--warn);border:1px solid var(--warn)44;background:var(--warn)10}
.b-removed{color:var(--text2);border:1px solid var(--line2);background:var(--surface)}
.b-ghost{color:var(--bad);border:1px solid var(--bad)44;background:var(--bad)10}
.b-alone{color:var(--brand);border:1px solid var(--brand)44;background:var(--brand-dim)}
.b-junk{color:var(--text3);border:1px solid var(--line2);background:var(--surface)}

.df-list{max-height:150px;overflow:auto;font-size:11px;color:var(--text2);line-height:1.7;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);padding:6px 8px;margin-top:6px}
.df-list .df-row{display:flex;justify-content:space-between;gap:8px}
.df-list .df-row span:last-child{color:var(--text3);flex-shrink:0}
.df-empty{font-size:11px;color:var(--text3);padding:6px 0}
.df-sum{font-size:11px;color:var(--text2);margin-top:6px}
.df-sum b{color:var(--text)}
.alone-warn{font-size:11px;color:var(--brand);background:var(--brand-dim);border:1px solid var(--brand)44;border-radius:var(--r2);padding:6px 8px;margin-top:6px}
.tip{font-size:11px;color:var(--text2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px;margin-bottom:14px;line-height:1.7}
.tip code{background:var(--card);padding:1px 4px;border-radius:4px}
.ph{text-align:center;color:var(--text3);padding:40px 0;font-size:12px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 22px;border-radius:24px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:110;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🗂️</div>
      <div class="logo-text">存储管理<span>程序 / 数据 / 垃圾 分列管理</span></div>
    </div>
    <div class="hdr-acts">
      <button class="btn" onclick="diskRefresh()">刷新</button>
      <button class="btn primary" onclick="openDiskBackup()">备份全部</button>
      <button class="btn" onclick="location.href='/'">← 返回首页</button>
    </div>
  </div>
</div>
<div class="main">
  <div class="tip">每个工具占一行,<b>左列程序</b>(代码,可重建)与<b>右列数据</b>(用户数据,单独清理)分开标注。
    清理/删除前会自动备份到 <code>data/backups/</code>(可还原)。<span id="ver" style="float:right"></span></div>
  <div class="stats" id="diskStats"></div>
  <div id="diskList"><div class="ph">加载中…</div></div>
</div>
<div class="toast" id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/disk-page.js"></script>
</body>
</html>
